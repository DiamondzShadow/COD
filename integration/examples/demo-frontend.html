<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COD Bet Arena - Integration Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 30px 0;
      border-bottom: 2px solid #e94560;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 2.5rem;
      color: #e94560;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }

    .subtitle {
      color: #a8dadc;
      margin-top: 10px;
    }

    .section {
      background: rgba(255,255,255,0.05);
      border-radius: 10px;
      padding: 25px;
      margin-bottom: 25px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
    }

    h2 {
      color: #e94560;
      margin-bottom: 15px;
      font-size: 1.5rem;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      color: #a8dadc;
    }

    input, select, button {
      width: 100%;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.1);
      color: #fff;
      font-size: 14px;
    }

    button {
      background: #e94560;
      border: none;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s;
      margin-top: 10px;
    }

    button:hover {
      background: #ff5577;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(233, 69, 96, 0.4);
    }

    button:disabled {
      background: #555;
      cursor: not-allowed;
      transform: none;
    }

    .comparison-grid {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 20px;
      align-items: center;
      margin-top: 20px;
    }

    .player-card {
      background: rgba(255,255,255,0.05);
      padding: 20px;
      border-radius: 10px;
      border: 2px solid rgba(233, 69, 96, 0.5);
    }

    .player-card h3 {
      color: #e94560;
      margin-bottom: 15px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .stat-label {
      color: #a8dadc;
    }

    .stat-value {
      color: #fff;
      font-weight: bold;
    }

    .vs-badge {
      background: #e94560;
      padding: 15px 25px;
      border-radius: 50%;
      font-size: 1.5rem;
      font-weight: bold;
      text-align: center;
    }

    .odds-display {
      text-align: center;
      padding: 20px;
      background: rgba(233, 69, 96, 0.2);
      border-radius: 10px;
      margin-top: 20px;
    }

    .odds-display h3 {
      color: #e94560;
      margin-bottom: 10px;
    }

    .odds-value {
      font-size: 2rem;
      font-weight: bold;
      color: #4ecca3;
    }

    .status {
      padding: 10px;
      border-radius: 5px;
      margin-top: 15px;
      text-align: center;
    }

    .status.success {
      background: rgba(78, 204, 163, 0.2);
      color: #4ecca3;
    }

    .status.error {
      background: rgba(233, 69, 96, 0.2);
      color: #e94560;
    }

    .status.info {
      background: rgba(168, 218, 220, 0.2);
      color: #a8dadc;
    }

    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #e94560;
      animation: spin 1s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .winner-badge {
      display: inline-block;
      background: #4ecca3;
      color: #1a1a2e;
      padding: 5px 15px;
      border-radius: 20px;
      font-weight: bold;
      margin-left: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🎮 COD BET ARENA</h1>
      <p class="subtitle">Integration Demo with COD API Wrapper</p>
    </header>

    <!-- Authentication Section -->
    <div class="section">
      <h2>🔐 Authentication</h2>
      <div class="form-group">
        <label for="username">Activision Email</label>
        <input type="email" id="username" placeholder="your_email@example.com">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Your password">
      </div>
      <button onclick="login()">Login to Activision</button>
      <div id="auth-status"></div>
    </div>

    <!-- Player Comparison Section -->
    <div class="section">
      <h2>⚔️ Player Comparison & Betting Odds</h2>
      
      <div class="grid-2">
        <div>
          <h3 style="color: #4ecca3; margin-bottom: 15px;">Player 1</h3>
          <div class="form-group">
            <label>Username</label>
            <input type="text" id="player1" placeholder="ATE48">
          </div>
          <div class="form-group">
            <label>Platform</label>
            <select id="platform1">
              <option value="xbl">Xbox Live</option>
              <option value="psn">PlayStation</option>
              <option value="battle">Battle.net</option>
              <option value="steam">Steam</option>
            </select>
          </div>
        </div>

        <div>
          <h3 style="color: #4ecca3; margin-bottom: 15px;">Player 2</h3>
          <div class="form-group">
            <label>Username</label>
            <input type="text" id="player2" placeholder="OpponentName">
          </div>
          <div class="form-group">
            <label>Platform</label>
            <select id="platform2">
              <option value="psn">PlayStation</option>
              <option value="xbl">Xbox Live</option>
              <option value="battle">Battle.net</option>
              <option value="steam">Steam</option>
            </select>
          </div>
        </div>
      </div>

      <div class="form-group" style="margin-top: 20px;">
        <label>Game</label>
        <select id="game">
          <option value="mw2">Modern Warfare 2 (2022)</option>
          <option value="mw">Modern Warfare (2019)</option>
          <option value="cw">Black Ops Cold War</option>
          <option value="bo4">Black Ops 4</option>
        </select>
      </div>

      <button onclick="comparePlayers()">Compare Players & Calculate Odds</button>
      <div id="comparison-result"></div>
    </div>

    <!-- Player Stats Lookup -->
    <div class="section">
      <h2>📊 Player Stats Lookup</h2>
      <div class="grid-2">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="lookup-player" placeholder="PlayerName">
        </div>
        <div class="form-group">
          <label>Platform</label>
          <select id="lookup-platform">
            <option value="xbl">Xbox Live</option>
            <option value="psn">PlayStation</option>
            <option value="battle">Battle.net</option>
            <option value="steam">Steam</option>
          </select>
        </div>
      </div>
      <button onclick="lookupPlayer()">Get Player Stats</button>
      <div id="lookup-result"></div>
    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:3000';

    async function login() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const statusDiv = document.getElementById('auth-status');

      if (!username || !password) {
        statusDiv.innerHTML = '<div class="status error">Please enter username and password</div>';
        return;
      }

      statusDiv.innerHTML = '<div class="status info"><span class="loading"></span> Logging in...</div>';

      try {
        const response = await fetch(`${API_URL}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (data.success) {
          statusDiv.innerHTML = '<div class="status success">✓ Successfully authenticated!</div>';
          document.getElementById('password').value = '';
        } else {
          statusDiv.innerHTML = `<div class="status error">✗ ${data.message || data.error}</div>`;
        }
      } catch (error) {
        statusDiv.innerHTML = `<div class="status error">✗ Connection error: ${error.message}</div>`;
      }
    }

    async function comparePlayers() {
      const player1 = document.getElementById('player1').value;
      const platform1 = document.getElementById('platform1').value;
      const player2 = document.getElementById('player2').value;
      const platform2 = document.getElementById('platform2').value;
      const game = document.getElementById('game').value;
      const resultDiv = document.getElementById('comparison-result');

      if (!player1 || !player2) {
        resultDiv.innerHTML = '<div class="status error">Please enter both player names</div>';
        return;
      }

      resultDiv.innerHTML = '<div class="status info"><span class="loading"></span> Fetching player stats...</div>';

      try {
        const response = await fetch(`${API_URL}/compare`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            player1, platform1, player2, platform2,
            title: game, mode: 'mp'
          })
        });

        const data = await response.json();

        if (data.success) {
          displayComparison(data);
        } else {
          resultDiv.innerHTML = `<div class="status error">✗ ${data.error}</div>`;
        }
      } catch (error) {
        resultDiv.innerHTML = `<div class="status error">✗ Error: ${error.message}</div>`;
      }
    }

    function displayComparison(data) {
      const { player1, player2, comparison } = data;
      const favorite = comparison.player1Advantage ? player1.username : player2.username;
      
      const html = `
        <div class="comparison-grid">
          <div class="player-card">
            <h3>${player1.username} ${comparison.player1Advantage ? '<span class="winner-badge">FAVORITE</span>' : ''}</h3>
            <div class="stat-row">
              <span class="stat-label">K/D Ratio:</span>
              <span class="stat-value">${player1.stats.kdRatio}</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">W/L Ratio:</span>
              <span class="stat-value">${player1.stats.wlRatio}</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Level:</span>
              <span class="stat-value">${player1.stats.level}</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Wins:</span>
              <span class="stat-value">${player1.stats.wins}</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Kills:</span>
              <span class="stat-value">${player1.stats.kills.toLocaleString()}</span>
            </div>
          </div>

          <div class="vs-badge">VS</div>

          <div class="player-card">
            <h3>${player2.username} ${!comparison.player1Advantage ? '<span class="winner-badge">FAVORITE</span>' : ''}</h3>
            <div class="stat-row">
              <span class="stat-label">K/D Ratio:</span>
              <span class="stat-value">${player2.stats.kdRatio}</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">W/L Ratio:</span>
              <span class="stat-value">${player2.stats.wlRatio}</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Level:</span>
              <span class="stat-value">${player2.stats.level}</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Wins:</span>
              <span class="stat-value">${player2.stats.wins}</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Kills:</span>
              <span class="stat-value">${player2.stats.kills.toLocaleString()}</span>
            </div>
          </div>
        </div>

        <div class="odds-display">
          <h3>Match Analysis</h3>
          <div style="margin-top: 15px;">
            <div style="margin-bottom: 10px;">
              <strong>Favorite:</strong> ${favorite}
            </div>
            <div style="margin-bottom: 10px;">
              <strong>K/D Difference:</strong> ${Math.abs(comparison.kdRatioDiff)}
            </div>
            <div style="margin-bottom: 10px;">
              <strong>Skill Gap:</strong> ${comparison.skillGap}/100
            </div>
            <div style="margin-top: 20px; font-size: 0.9rem; color: #a8dadc;">
              ${comparison.skillGap > 15 ? '⚠️ Large skill gap detected - Favorite is heavily favored' : '✓ Competitive matchup'}
            </div>
          </div>
        </div>
      `;

      document.getElementById('comparison-result').innerHTML = html;
    }

    async function lookupPlayer() {
      const player = document.getElementById('lookup-player').value;
      const platform = document.getElementById('lookup-platform').value;
      const resultDiv = document.getElementById('lookup-result');

      if (!player) {
        resultDiv.innerHTML = '<div class="status error">Please enter a player name</div>';
        return;
      }

      resultDiv.innerHTML = '<div class="status info"><span class="loading"></span> Loading stats...</div>';

      try {
        const response = await fetch(`${API_URL}/stats/${platform}/${player}/mp?title=mw2`);
        const data = await response.json();

        if (data.success) {
          const stats = data.stats;
          resultDiv.innerHTML = `
            <div class="player-card" style="margin-top: 20px;">
              <h3>${data.player} (${platform.toUpperCase()})</h3>
              <div class="stat-row">
                <span class="stat-label">Level:</span>
                <span class="stat-value">${stats.level} (Prestige ${stats.prestige})</span>
              </div>
              <div class="stat-row">
                <span class="stat-label">K/D Ratio:</span>
                <span class="stat-value">${stats.kdRatio}</span>
              </div>
              <div class="stat-row">
                <span class="stat-label">W/L Ratio:</span>
                <span class="stat-value">${stats.wlRatio}</span>
              </div>
              <div class="stat-row">
                <span class="stat-label">Total Kills:</span>
                <span class="stat-value">${stats.kills.toLocaleString()}</span>
              </div>
              <div class="stat-row">
                <span class="stat-label">Total Wins:</span>
                <span class="stat-value">${stats.wins}</span>
              </div>
              <div class="stat-row">
                <span class="stat-label">Games Played:</span>
                <span class="stat-value">${stats.gamesPlayed}</span>
              </div>
              <div class="stat-row">
                <span class="stat-label">Score Per Minute:</span>
                <span class="stat-value">${stats.scorePerMinute}</span>
              </div>
            </div>
          `;
        } else {
          resultDiv.innerHTML = `<div class="status error">✗ ${data.error}</div>`;
        }
      } catch (error) {
        resultDiv.innerHTML = `<div class="status error">✗ Error: ${error.message}</div>`;
      }
    }

    // Check auth status on load
    window.addEventListener('load', async () => {
      try {
        const response = await fetch(`${API_URL}/auth/status`);
        const data = await response.json();
        
        if (data.authenticated) {
          document.getElementById('auth-status').innerHTML = 
            '<div class="status success">✓ Already authenticated</div>';
        }
      } catch (error) {
        console.log('Not authenticated yet');
      }
    });
  </script>
</body>
</html>
